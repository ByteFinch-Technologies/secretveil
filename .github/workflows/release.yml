# Build and publish a release.
#
# A release is made from a tag and from nothing else. The full test set runs
# first, and the security gates run again here, because a release is the last
# place to catch a change that got past a pull request.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same gates as CI. A release must not be able to skip them.
  gate:
    name: the gates hold
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # goreleaser uploads the archives to the release.
      contents: write
      # cosign asks GitHub for a short lived identity token. There is no
      # private key anywhere, so there is no key to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the tags to work out the version and the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm job needs the same binaries. They are handed over rather than
      # built again, so that the file a developer gets from npm is the same
      # file that the checksum on the release page describes.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          retention-days: 1
          path: |
            dist/artifacts.json
            dist/*/secretveil

  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # --provenance asks GitHub for a short lived identity token, the same way
      # cosign does.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # A job level "if" cannot read the secrets context, so the question is
      # asked in a step instead. A missing token skips the publish and says so.
      # It does not fail the release, because the binaries are already out.
      - name: is there an npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not set, so nothing is published to npm."
            echo "See npm/README.md for what has to exist first."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.have == 'true'
        with:
          name: dist
          path: dist

      - name: make the packages
        if: steps.token.outputs.have == 'true'
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}"

      # The platform packages go first. The main package depends on them, and a
      # developer who installs it before its binary exists gets an error
      # instead of a program.
      - name: publish
        if: steps.token.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for d in npm/platforms/*; do
            npm publish "./$d" --access public --provenance
          done
          npm publish ./npm/secretveil --access public --provenance
