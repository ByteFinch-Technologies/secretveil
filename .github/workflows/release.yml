# Build and publish a release.
#
# A release is made from a tag and from nothing else. The full test set runs
# first, and the security gates run again here, because a release is the last
# place to catch a change that got past a pull request.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same gates as CI. A release must not be able to skip them.
  gate:
    name: the gates hold
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # goreleaser uploads the archives to the release.
      contents: write
      # cosign asks GitHub for a short lived identity token. There is no
      # private key anywhere, so there is no key to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the tags to work out the version and the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: sigstore/cosign-installer@v3

      # syft writes the bill of materials that goes beside each archive.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm job needs the same binaries. They are handed over rather than
      # built again, so that the file a developer gets from npm is the same
      # file that the checksum on the release page describes.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          retention-days: 1
          path: |
            dist/artifacts.json
            dist/*/secretveil

  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm asks GitHub for a short lived identity token and trades it for the
      # right to publish. No secret is stored anywhere. The same token signs
      # the provenance statement, so cosign and npm prove the same thing about
      # the same commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships a new
      # enough npm today, but the bundled version is not a promise. An old npm
      # does not report that it cannot do a trusted publish. It asks for a
      # token instead and the publish fails with a 404, which reads like a
      # missing package. This one line removes that whole class of confusion.
      - name: get an npm that knows trusted publishing
        run: npm install --global npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: make the packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}"

      # The platform packages go first. The main package depends on them, and a
      # developer who installs it before its binary exists gets an error
      # instead of a program.
      #
      # There is no NODE_AUTH_TOKEN and no --provenance flag. A trusted publish
      # writes the provenance statement by itself, and it works only when this
      # repository and this file name match the trusted publisher that npm
      # holds for the package. Each of the five packages carries its own
      # configuration. A new package will not publish until it has one.
      # See npm/README.md.
      - name: publish
        run: |
          set -e
          for d in npm/platforms/*; do
            npm publish "./$d" --access public
          done
          npm publish ./npm/secretveil --access public
