# Build and publish a release.
#
# A release is made from a tag and from nothing else. The full test set runs
# first, and the security gates run again here, because a release is the last
# place to catch a change that got past a pull request.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same gates as CI. A release must not be able to skip them.
  gate:
    name: the gates hold
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # goreleaser uploads the archives to the release.
      contents: write
      # cosign asks GitHub for a short lived identity token. There is no
      # private key anywhere, so there is no key to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the tags to work out the version and the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
