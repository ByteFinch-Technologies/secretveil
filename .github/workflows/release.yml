# Build and publish a release.
#
# A release is made from a tag and from nothing else. The full test set runs
# first, and the security gates run again here, because a release is the last
# place to catch a change that got past a pull request.
#
# Every action is pinned to a commit, not to a tag. npm trusted publishing
# trusts this file by name, so the job below with id-token: write can mint the
# credential that publishes secretveil to npm. A tag such as @v6 can be moved
# to any commit by the person who owns that action. A commit cannot. Dependabot
# raises a pull request when a pinned action has a new release, and the comment
# after each commit says which release it is.
name: Release

on:
  push:
    tags: ["v*"]

  # A manual run proves this file without publishing anything. It builds a
  # snapshot, it makes no release, and it publishes nothing to npm. Run it
  # after a change to any action below, because a pull request never runs
  # this workflow and a tag is a bad place to find a broken step.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same gates as CI. A release must not be able to skip them.
  gate:
    name: the gates hold
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # goreleaser uploads the archives to the release.
      contents: write
      # cosign asks GitHub for a short lived identity token. There is no
      # private key anywhere, so there is no key to leak.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # goreleaser reads the tags to work out the version and the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # The cosign version is pinned. Version 4 of this action installs cosign
      # v3 by default, and cosign v3 needs the --bundle flag on sign-blob. Our
      # .goreleaser.yaml writes a separate certificate and signature, and
      # docs/install.md tells the user to verify with that pair. Cosign v2 is
      # still maintained. A move to the v3 bundle format is a separate change
      # that must update the signing arguments and the document together.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: say which cosign is installed
        run: cosign version

      # syft writes the bill of materials that goes beside each archive.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: >-
            ${{ github.ref_type == 'tag' && 'release --clean'
            || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm job needs the same binaries. They are handed over rather than
      # built again, so that the file a developer gets from npm is the same
      # file that the checksum on the release page describes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          retention-days: 1
          path: |
            dist/artifacts.json
            dist/*/secretveil

  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm asks GitHub for a short lived identity token and trades it for the
      # right to publish. No secret is stored anywhere. The same token signs
      # the provenance statement, so cosign and npm prove the same thing about
      # the same commit.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships a new
      # enough npm today, but the bundled version is not a promise. An old npm
      # does not report that it cannot do a trusted publish. It asks for a
      # token instead and the publish fails with a 404, which reads like a
      # missing package. This one line removes that whole class of confusion.
      - name: get an npm that knows trusted publishing
        run: npm install --global npm@latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # On a tag the version comes from the tag. A manual run has no tag, so
      # it uses a name that can never be a real release.
      - name: make the packages
        run: |
          version="0.0.0-dispatch"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          node npm/build.mjs "$version"

      # The platform packages go first. The main package depends on them, and a
      # developer who installs it before its binary exists gets an error
      # instead of a program.
      #
      # There is no NODE_AUTH_TOKEN and no --provenance flag. A trusted publish
      # writes the provenance statement by itself, and it works only when this
      # repository and this file name match the trusted publisher that npm
      # holds for the package. Each of the five packages carries its own
      # configuration. A new package will not publish until it has one.
      # See npm/README.md.
      - name: publish
        if: github.ref_type == 'tag'
        run: |
          set -e
          for d in npm/platforms/*; do
            npm publish "./$d" --access public
          done
          npm publish ./npm/secretveil --access public
