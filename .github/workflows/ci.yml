# The gate that every change has to pass.
#
# Five jobs, and each one answers a different question.
#
#   test           Does it work, on both operating systems we support?
#   promises       Are the two security promises still true?
#   fuzz           Do the properties hold on input nobody wrote by hand?
#   cross-compile  Does it still build for every platform we ship?
#   bun            Does the npm package install and run under bun?
#
# The promises job is separate on purpose. If it goes red, the name in the list
# of checks says what broke, and nobody has to open the log to find out.
#
# Every action is pinned to a commit, not to a tag. The reason is written out
# in release.yml, which is the file that matters most.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A test must never reach a network. A module download that happens during a
  # test would hide that. Everything is downloaded once, before the tests run.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64 and ubuntu-latest is amd64, so the two runners
        # cover both processor families as well as both operating systems.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      - name: the source is formatted
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed a file. Run it and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

  promises:
    name: the security promises hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      # An agent must not be able to get a value out. Two of the cases record a
      # limit the product does not stop, and they assert that the theft still
      # succeeds. A red mark here means the threat model is now wrong, in one
      # direction or the other, and docs/threat-model.md has to change with the
      # code.
      - name: an agent cannot escape
        run: go test -count=1 -v ./test/adversarial/

      # The binary must not be able to send anything anywhere. This reads the
      # build graph, so a network package that arrives through a dependency of
      # a dependency is caught before it ships.
      - name: the binary cannot reach a network
        run: go test -count=1 -v ./test/nonetwork/

      # A value must not reach the terminal.
      - name: no value survives the filter
        run: go test -count=1 -v ./test/leak/

      # No file of this repository may hold a value shaped like a credential.
      # The rule has been broken three times: twice the host blocked the push,
      # and once secret scanning raised an alert after the push went through. A
      # reader cannot tell a made-up key from a real one, so nobody knows
      # whether to revoke anything. The check runs the classifier's own shape
      # rules over every file.
      - name: no file holds a credential-shaped value
        run: go test -count=1 -v ./test/hygiene/

  # "go test" runs a fuzz target only against the inputs in testdata. That is a
  # handful of cases, and it is not a fuzz run. Two faults in the fuzz targets
  # themselves hid behind that for a whole build, so the targets run here for a
  # fixed number of cases on every change.
  #
  # A failing input is written to testdata by the run itself. Read the log, copy
  # the input into the seed list, and fix the fault.
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/envfile/, target: FuzzRoundTrip }
          - { pkg: ./internal/envfile/, target: FuzzSetReparse }
          - { pkg: ./internal/redact/, target: FuzzNoNeedleSurvives }
          - { pkg: ./internal/redact/, target: FuzzChunkingIsInvariant }
          - { pkg: ./internal/redact/, target: FuzzIdleFlushIsInvariant }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      # A count is used and not a time, so the same change gets the same amount
      # of work on a fast runner and on a slow one.
      - name: fuzz
        run: go test ${{ matrix.pkg }} -run=XXX -fuzz='^${{ matrix.target }}$' -fuzztime=300000x

      - name: show a failing input
        if: failure()
        run: |
          echo "The run wrote the input below into testdata. Add it to the seed list."
          find . -path '*/testdata/fuzz/*' -newer go.mod -type f -print -exec cat {} \;

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: download the modules
        run: go mod download

      # CGO is off, so one machine can build every platform and the result has
      # no library to install. A keyring is reached through a command line
      # program and not through a C library, which is what makes this possible.
      - name: build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o "secretveil-${GOOS}-${GOARCH}" ./cmd/secretveil
          ls -l "secretveil-${GOOS}-${GOARCH}"

  # bun is a second JavaScript runtime, and a developer may have it and no
  # Node.js at all. Three things have to hold on such a machine, and none of
  # them is covered by a Go test.
  #
  #   1. bun installs the package and takes only the platform package that
  #      matches the machine.
  #   2. The shim on the path starts the binary with no Node.js anywhere.
  #   3. run says so when bun loads a .env file that run does not read. bun
  #      reads up to eight names and run reads two.
  #
  # The packages are made here from the binary this branch builds, and not
  # taken from the registry, so the job tests the change and not the release.
  bun:
    name: bun installs and runs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: download the modules
        run: go mod download

      - name: build the binary
        run: go build -trimpath -o work/secretveil ./cmd/secretveil

      # The two packages a Linux runner needs, in the shape npm/build.mjs
      # makes them. A tarball is used and not a directory, because a directory
      # is linked and not copied, and a linked package resolves its own
      # dependency from the source tree instead of from node_modules.
      - name: make the packages
        run: |
          mkdir -p work/platform/bin
          cp work/secretveil work/platform/bin/secretveil
          chmod +x work/platform/bin/secretveil
          cat > work/platform/package.json <<'JSON'
          {
            "name": "@secretveil/linux-x64",
            "version": "0.1.0",
            "os": ["linux"],
            "cpu": ["x64"],
            "files": ["bin/secretveil"]
          }
          JSON
          mkdir -p work/tgz
          ( cd npm/secretveil && bun pm pack --destination "$GITHUB_WORKSPACE/work/tgz" )
          ( cd work/platform && bun pm pack --destination "$GITHUB_WORKSPACE/work/tgz" )
          ls -l work/tgz

      - name: bun installs it
        run: |
          mkdir -p work/project
          cat > work/project/package.json <<JSON
          {
            "name": "bun-check",
            "private": true,
            "dependencies": {
              "secretveil": "file:$GITHUB_WORKSPACE/work/tgz/secretveil-0.1.0.tgz"
            },
            "overrides": {
              "@secretveil/linux-x64": "file:$GITHUB_WORKSPACE/work/tgz/secretveil-linux-x64-0.1.0.tgz"
            }
          }
          JSON
          cd work/project
          bun install
          # Only the package for this machine may be on disk. The other three
          # are optional and bun reads "os" and "cpu" the way npm does.
          test -x node_modules/@secretveil/linux-x64/bin/secretveil
          for other in darwin-arm64 darwin-x64 linux-arm64; do
            if [ -e "node_modules/@secretveil/$other" ]; then
              echo "bun installed @secretveil/$other on a linux x64 machine"
              exit 1
            fi
          done

      # A project marker is needed, or the command walks up out of the
      # workspace looking for one.
      - name: the command runs, with Node.js and without it
        run: |
          cd work/project
          git init -q .
          node --version
          ./node_modules/.bin/secretveil version
          # The same call again, with the node binary taken off the path. The
          # shell line of the shim has to find bun and start it.
          # Every directory that holds a node binary comes off the path, and
          # the directory of bun goes on the front of what is left.
          nonode="$(dirname "$(command -v bun)")"
          for dir in $(echo "$PATH" | tr ':' ' '); do
            if [ ! -x "$dir/node" ]; then nonode="$nonode:$dir"; fi
          done
          export PATH="$nonode"
          if command -v node; then echo "node is still on the path"; exit 1; fi

          ./node_modules/.bin/secretveil version
          bun --print "require('secretveil').binaryPath()"
          ./node_modules/.bin/secretveil doctor

      # bun loads .env.development and run does not. The developer has to be
      # told, because the program gets the handle text and the failure gives
      # no reason.
      - name: run warns about a .env file it did not read
        env:
          SECRETVEIL_CALLER: human
          SECRETVEIL_PASSPHRASE: a passphrase for this check only
        run: |
          sv="$GITHUB_WORKSPACE/work/secretveil"
          mkdir -p work/warn && cd work/warn
          git init -q .
          # The values are made here, so no file of this repository holds a
          # value shaped like a credential.
          printf 'API_KEY=%s\n' "$(head -c 18 /dev/urandom | base64)" > .env
          printf 'STRIPE_DEV=%s\n' "$(head -c 18 /dev/urandom | base64)" > .env.development
          cat > package.json <<'JSON'
          { "name": "bun-warn", "private": true, "scripts": { "show": "bun show.ts" } }
          JSON
          cat > show.ts <<'TS'
          for (const name of ["API_KEY", "STRIPE_DEV"]) {
            const value = process.env[name] ?? "";
            console.log(`${name} isHandle=${value.startsWith("sv://")}`);
          }
          TS
          "$sv" init -y

          "$sv" run -- bun run show > out.txt 2> err.txt
          cat err.txt
          grep -q 'API_KEY isHandle=false' out.txt
          grep -q 'STRIPE_DEV isHandle=true' out.txt
          grep -q '.env.development holds a handle and run did not read it' err.txt
          grep -q -- '--env-file .env --env-file .env.development' err.txt

          # The line that run printed has to be the line that fixes it.
          "$sv" run --env-file .env --env-file .env.development -- bun run show > out2.txt 2> err2.txt
          grep -q 'API_KEY isHandle=false' out2.txt
          grep -q 'STRIPE_DEV isHandle=false' out2.txt
          if grep -q 'did not read it' err2.txt; then
            echo "run still warns after the files were named"
            exit 1
          fi
